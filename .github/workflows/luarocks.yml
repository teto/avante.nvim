name: Push to luarocks.org

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.4.3)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
    secrets:
      LUAROCKS_API_KEY:
        required: true
  push:
    tags:
      - '*'
  release:
    types:
      - created

jobs:
  luarocks-upload:
    if: github.repository == 'avante-corp/avante.nvim'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0 # Required to count the commits
      - name: Get Version
        run: echo "LUAROCKS_VERSION=$(git describe --exact-match --tags)" >> "$GITHUB_ENV"
      - name: LuaRocks Upload
        uses: nvim-neorocks/luarocks-tag-release@v8
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          template: avante.nvim-scm-1.rockspec
          version: ${{ env.LUAROCKS_VERSION }}
          summary: USED_AS_TEMPLATE
